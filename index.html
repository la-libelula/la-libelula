  <script>
    // NUCLEAR AUTO-RESET v22
    const CURRENT_VERSION = "22";
    if (localStorage.getItem("libelula_version") !== CURRENT_VERSION) {
      console.log("Forcing Nuclear Reset to v22...");
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (let reg of regs) reg.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
      }
      localStorage.setItem("libelula_version", CURRENT_VERSION);
      setTimeout(() => { window.location.reload(true); }, 500);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/worker-v22.js')
          .then(reg => {
            console.log('SW Registered v22:', reg);
          })
          .catch(err => console.error('SW Failed:', err));
      });
    }
  </script>
