<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiando La Libélula...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: #1e3a24;
            color: white;
            margin: 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <div class="status" id="status">Iniciando limpieza profunda...</div>
    <p>Por favor, no cierres esta página.</p>

    <script>
        async function nuclearReset() {
            const status = document.getElementById('status');

            try {
                // 1. Unregister ALL service workers
                status.innerText = "Desinstalando versiones antiguas...";
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log("Unregistered:", registration);
                    }
                }

                // 2. Clear ALL caches
                status.innerText = "Borrando memoria temporal (Caches)...";
                if ('caches' in window) {
                    const names = await caches.keys();
                    for (let name of names) {
                        await caches.delete(name);
                        console.log("Deleted cache:", name);
                    }
                }

                // 3. Clear LocalStorage and SessionStorage
                status.innerText = "Limpiando datos de sesión...";
                localStorage.clear();
                sessionStorage.clear();

                status.innerText = "¡LIMPIEZA COMPLETADA!";
                setTimeout(() => {
                    status.innerText = "Redirigiendo a la nueva versión...";
                    window.location.href = "/?v=19_FINAL_COMPLETE";
                }, 2000);

            } catch (err) {
                status.innerText = "Error en la limpieza: " + err.message;
                status.style.color = "#ff6b6b";
            }
        }

        // Start after a short delay
        setTimeout(nuclearReset, 1000);
    </script>
</body>

</html>
